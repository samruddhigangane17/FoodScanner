<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Label Scanner</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1d2733;--mut:#667;--bd:#dde3ea;--ac:#1f6feb;--bad:#c62828;--badbg:#fdecea;--ok:#1b7f3b;--okbg:#e8f5ec;--warn:#b26a00;--warnbg:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mut:#9aa6b4;--bd:#2c3642;--ac:#5aa2ff;--bad:#ff8a80;--badbg:#3a1f1f;--ok:#6fdc8c;--okbg:#17301f;--warn:#ffc266;--warnbg:#3a2e14}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:20px;text-align:center}header h1{margin:0;font-size:1.6rem}header p{margin:4px 0 0;opacity:.9}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:1.1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.chk{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.chk:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:10px;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;cursor:pointer;font-size:1rem}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:100px}label.l{display:block;margin:10px 0 4px;color:var(--mut);font-size:.9rem}
button.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:1.05rem;cursor:pointer}
button.go:disabled{opacity:.6}button.sec{padding:8px 12px;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;cursor:pointer}
.verdict{padding:16px;border-radius:10px;font-weight:600;font-size:1.1rem;margin-bottom:12px}
.v-bad{background:var(--badbg);color:var(--bad)}.v-ok{background:var(--okbg);color:var(--ok)}.v-info{background:var(--warnbg);color:var(--warn)}
.ing{border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ing.bad{border-left-color:var(--bad);background:var(--badbg)}.ing.unk{border-left-color:var(--warn)}
.ing b{text-transform:capitalize}.ing small{color:var(--mut)}.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.78rem;margin:4px 4px 0 0;background:var(--bad);color:#fff}
.tag.diet{background:var(--warn)}.note{color:var(--mut);font-size:.85rem;margin-top:10px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
details{margin-top:8px}pre{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:8px}
</style></head><body>
<header><h1>Food Label Scanner</h1><p>Scan an ingredient label, understand it, and get warned</p></header>
<main>
<div class="card"><h2>1. Your restrictions</h2><div class="grid" id="prof"></div></div>
<div class="card"><h2>2. Add the ingredients</h2>
 <div class="tabs"><button class="tab on" id="t1">Upload photo</button><button class="tab" id="t2">Type / paste</button></div>
 <div id="p1"><input type="file" id="file" accept="image/*"><div class="note">Photograph only the ingredients section: flat, well lit, no glare.</div></div>
 <div id="p2" hidden><textarea id="txt" placeholder="Wheat flour, sugar, milk powder, lecithin (E322), salt"></textarea></div>
 <label class="l" for="prod">Product name (optional)</label><input type="text" id="prod" maxlength="40" placeholder="e.g. Chocolate biscuit">
 <button class="go" id="go">Analyse</button></div>
<div id="res"></div>
<div class="card"><h2>Scan history</h2><button class="sec" id="hb">Show history</button><div id="hist"></div></div>
<p class="note">Informational only. Always read the actual label; with severe allergies consult a doctor.</p>
</main>
<script>
const FL=[["Nut allergy",1],["Dairy-free / lactose intolerant",2],["Gluten-free",4],["Soy allergy",8],["Vegetarian / vegan",16],["Diabetic / avoiding sugar",32]];
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
let saved=0;try{saved=+localStorage.getItem("prof")||0}catch(e){}
FL.forEach(([n,b])=>{const l=el("label","chk");const i=el("input");i.type="checkbox";i.value=b;i.checked=!!(saved&b);
 i.onchange=()=>{try{localStorage.setItem("prof",profile())}catch(e){}};l.append(i,el("span","",n));$("prof").append(l)});
const profile=()=>[...document.querySelectorAll("#prof input:checked")].reduce((a,i)=>a+ +i.value,0);
let mode=1;function tab(m){mode=m;$("t1").className="tab"+(m==1?" on":"");$("t2").className="tab"+(m==2?" on":"");$("p1").hidden=m!=1;$("p2").hidden=m!=2}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
$("go").onclick=async()=>{
 const p=profile(),prod=$("prod").value.trim()||"Web scan";let r;$("go").disabled=true;$("go").textContent="Analysing...";
 try{
  if(mode==1){const f=$("file").files[0];if(!f){alert("Choose a photo first, or use the Type tab.");return}
   r=await fetch("/api/ocr",{method:"POST",headers:{"Content-Type":f.type,"X-Profile":p,"X-Product":prod},body:f});}
  else{const t=$("txt").value.trim();if(!t){alert("Type the ingredients first.");return}
   r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,profile:p,product:prod})});}
  show(await r.json(),p);
 }catch(e){show({ok:false,error:"Could not reach the server. Is server.py running?"},p)}
 finally{$("go").disabled=false;$("go").textContent="Analyse"}};
function show(d,p){const R=$("res");R.replaceChildren();const c=el("div","card");R.append(c);
 if(!d.ok){c.append(el("div","verdict v-bad",d.error));return}
 if(!d.count){c.append(el("div","verdict v-info","No ingredients could be found in that text."));return}
 const w=d.warnings,v=el("div","verdict");
 if(!p){v.className+=" v-info";v.textContent="No restrictions selected, so no warnings can be given."}
 else if(w.length){v.className+=" v-bad";v.textContent="NOT suitable for you: "+w.length+" ingredient"+(w.length>1?"s":"")+" conflict with your profile"}
 else{v.className+=" v-ok";v.textContent="No conflicts found with your profile"}
 c.append(v);
 if(w.length){const h=el("h2","","Warnings (most serious first)");c.append(h);
  w.forEach(x=>{const r=el("div","ing bad");r.append(el("b","",x.name));r.append(el("br"));
   x.reasons.forEach(q=>r.append(el("span","tag"+(x.severity==2?"":" diet"),(x.severity==2?"ALLERGY: ":"DIET: ")+q)));c.append(r)})}
 c.append(el("h2","","All ingredients explained"));
 d.items.forEach(i=>{const r=el("div","ing"+(!i.known?" unk":i.conflicts.length?" bad":""));r.append(el("b","",i.name));
  if(!i.known){r.append(el("br"));r.append(el("small","","Not in our database. Please check this one on the label yourself."))}
  else{if(i.read_as){r.append(el("small","","  (read as '"+i.read_as+"')"))}r.append(el("br"));r.append(el("span","",i.explanation));
   if(i.conflicts.length){r.append(el("br"));i.conflicts.forEach(q=>r.append(el("span","tag",q)))}}
  c.append(r)});
 if(d.ocr_text){const t=el("details");t.append(el("summary","","What the scanner read from the photo"),el("pre","",d.ocr_text));c.append(t)}
 if(d.unknown)c.append(el("div","note",d.unknown+" ingredient(s) could not be identified."))}
$("hb").onclick=async()=>{const h=$("hist");h.replaceChildren();const d=await (await fetch("/api/history")).json();
 if(!d.history.length){h.append(el("p","note","No scans yet."));return}
 const t=el("table");t.innerHTML="<tr><th>Product</th><th>Date</th><th>Warnings</th></tr>";
 d.history.forEach(x=>{const r=t.insertRow();r.insertCell().textContent=x.product;r.insertCell().textContent=x.when;r.insertCell().textContent=x.warnings});h.append(t)};
</script></body></html>
